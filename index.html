<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台湾5分彩 峰值分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft JhengHei",sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;padding:10px;font-size:14px}
.container{max-width:480px;margin:0 auto}
.header{text-align:center;border-bottom:2px solid #e94560;padding-bottom:12px;margin-bottom:12px}
.header h1{color:#e94560;font-size:20px}
.header .subtitle{color:#888;font-size:11px;margin-top:4px}
.current-issue{background:rgba(233,69,96,0.1);border:1px solid rgba(233,69,96,0.3);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center}
.issue-info{color:#e94560;font-weight:bold;font-size:12px;margin-bottom:8px}
.numbers-row{display:flex;justify-content:center;gap:8px}
.number-ball{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#e94560,#c73e54);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:white}
.prediction-box{background:rgba(78,205,196,0.08);border:1px solid rgba(78,205,196,0.3);border-radius:12px;padding:12px;margin-bottom:12px}
.pred-title{color:#ffe66d;font-weight:bold;font-size:14px;text-align:center;margin-bottom:10px}
.pred-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pred-item{background:rgba(0,0,0,0.3);border-radius:10px;padding:10px;text-align:center;border:1px solid #333}
.pos-name{color:#e94560;font-weight:bold;font-size:13px;margin-bottom:6px}
.pred-nums{display:flex;justify-content:center;gap:6px;margin:6px 0}
.pred-ball{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
.pred-ball.best{background:#4ecdc4;border:2px solid #ffe66d;color:#0f0f1a}
.pred-ball.worst{background:#e94560;border:2px solid #ff6b6b;color:white}
.pred-ball.normal{background:#333;border:1px solid #555;color:#e0e0e0}
.pred-meta{font-size:10px;color:#888;margin-top:4px}
.tabs{display:flex;gap:5px;margin-bottom:10px}
.tab{flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid #333;border-radius:8px;text-align:center;font-size:13px;font-weight:bold;color:#e0e0e0;cursor:pointer}
.tab.active{background:#e94560;border-color:#e94560;color:white}
.panel{display:none}
.panel.active{display:block}
.rank-section{margin-bottom:10px}
.rank-title{font-size:12px;font-weight:bold;margin-bottom:6px;padding-left:8px;border-left:3px solid}
.rank-list{background:rgba(0,0,0,0.2);border-radius:10px;padding:8px}
.rank-item{display:flex;align-items:center;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,0.05)}
.rank-ball{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;margin:0 8px}
.rank-bar-bg{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;margin-right:8px}
.rank-bar{height:100%;border-radius:4px}
.rank-score{width:35px;text-align:right;font-size:11px;font-weight:bold}
.rank-meta{width:50px;text-align:right;font-size:9px;color:#888}
.scheme-card{background:rgba(0,0,0,0.2);border-radius:10px;padding:10px;margin-bottom:8px;border-left:3px solid}
.scheme-title{font-size:12px;font-weight:bold;margin-bottom:6px}
.scheme-nums{display:flex;gap:5px;margin:5px 0;align-items:center;flex-wrap:wrap}
.scheme-nums span{color:#888;font-size:10px;margin-right:4px}
.s-ball{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
.s-ball.hit{background:#4ecdc4;color:#0f0f1a}
.s-ball.miss{background:#333;color:#e0e0e0;border:1px solid #555}
.scheme-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:10px;color:#aaa}
.scheme-stats div{background:rgba(0,0,0,0.2);padding:4px 6px;border-radius:4px}
.no-data{text-align:center;padding:40px 20px;color:#888}
.no-data h3{color:#e94560;margin-bottom:10px}
.diag-box{background:rgba(0,0,0,0.3);border:1px solid #333;border-radius:8px;padding:10px;margin:10px 0;font-size:11px;text-align:left;word-break:break-all;max-height:200px;overflow-y:auto}
.diag-box .ok{color:#4ecdc4}
.diag-box .err{color:#e94560}
.status-bar{text-align:center;font-size:10px;color:#666;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.05)}
.c-cyan{color:#4ecdc4}
.c-red{color:#e94560}
</style>
<base target="_blank">
</head>
<body>
<div class="container">
<div id="app">
  <div class="no-data">
    <h3>⏳ 正在加载数据...</h3>
    <p>首次加载可能需要几秒</p>
    <div id="diag" class="diag-box">初始化中...</div>
  </div>
</div>
</div>
<script>
(function(){
var API="https://kk18520705540-code.github.io/taiwan-five-predict/data.json";
var pNames=["萬位","千位","百位","十位","個位"];
var sNames=["熱號追蹤","冷號回補","趨勢跟隨","奇偶平衡","綜合評分"];
var colors=["#e94560","#4ecdc4","#ffe66d","#a8e6cf","#ff8b94"];
var globalData=[],globalAnalysis=null,currentTab=0;

function log(msg,type){var d=document.getElementById("diag");if(!d)return;var c=type==="ok"?"ok":(type==="err"?"err":"");d.innerHTML+='<div class="'+c+'">'+msg+'</div>';d.scrollTop=d.scrollHeight}

function s1(d){var w=Math.min(30,d.length-1);var r=d.slice(1,1+w);var f={};for(var i=0;i<=9;i++)f[i]=0;for(var i=0;i<r.length;i++)f[r[i]]++;var e=[];for(var k in f)e.push([parseInt(k),f[k]]);e.sort(function(a,b){return b[1]-a[1]});return e.slice(0,5).map(function(x){return x[0]})}
function s2(d){var g={};for(var i=0;i<=9;i++)g[i]=999;for(var i=1;i<d.length;i++){var n=d[i];if(g[n]===999)g[n]=i}var e=[];for(var k in g)e.push([parseInt(k),g[k]]);e.sort(function(a,b){return b[1]-a[1]});return e.slice(0,5).map(function(x){return x[0]})}
function s3(d){var w=Math.min(10,d.length-1);var r=d.slice(1,1+w);var bc=0,sc=0;for(var i=0;i<r.length;i++){if(r[i]>=5)bc++;else sc++}var pb=bc>=sc;var ca=[];for(var i=0;i<=9;i++)if((i>=5)===pb)ca.push(i);var f={};for(var i=0;i<ca.length;i++)f[ca[i]]=0;var r2=d.slice(1,21);for(var i=0;i<r2.length;i++){var n=r2[i];if(ca.indexOf(n)>=0)f[n]++}var e=[];for(var k in f)e.push([parseInt(k),f[k]]);e.sort(function(a,b){return b[1]-a[1]});var re=e.slice(0,5).map(function(x){return x[0]});if(re.length<5){for(var i=0;i<ca.length;i++){if(re.indexOf(ca[i])<0)re.push(ca[i]);if(re.length>=5)break}}return re.slice(0,5)}
function s4(d){var w=Math.min(15,d.length-1);var r=d.slice(1,1+w);var oc=0,ec=0;for(var i=0;i<r.length;i++){if(r[i]%2===1)oc++;else ec++}var po=ec>oc;var ca=[];for(var i=0;i<=9;i++)if((i%2===1)===po)ca.push(i);var g={};for(var i=0;i<ca.length;i++)g[ca[i]]=999;for(var i=1;i<d.length;i++){var n=d[i];if(ca.indexOf(n)>=0&&g[n]===999)g[n]=i}var e=[];for(var k in g)e.push([parseInt(k),g[k]]);e.sort(function(a,b){return b[1]-a[1]});var re=e.slice(0,5).map(function(x){return x[0]});if(re.length<5){for(var i=0;i<ca.length;i++){if(re.indexOf(ca[i])<0)re.push(ca[i]);if(re.length>=5)break}}return re.slice(0,5)}
function s5(d){var sc={};for(var i=0;i<=9;i++)sc[i]=0;var f={};for(var i=0;i<=9;i++)f[i]=0;var r3=d.slice(1,31);for(var i=0;i<r3.length;i++)f[r3[i]]++;var mf=0;for(var k in f)if(f[k]>mf)mf=f[k];if(mf===0)mf=1;for(var i=0;i<=9;i++)sc[i]+=(f[i]/mf)*40;var g={};for(var i=0;i<=9;i++)g[i]=999;for(var i=1;i<d.length;i++){var n=d[i];if(g[n]===999)g[n]=i}var mg=0;for(var k in g)if(g[k]<999&&g[k]>mg)mg=g[k];if(mg===0)mg=1;for(var i=0;i<=9;i++)if(g[i]<999)sc[i]+=(g[i]/mg)*30;var r1=d.slice(1,16);var oc=0,ec=0;for(var i=0;i<r1.length;i++){if(r1[i]%2===1)oc++;else ec++}var po=ec>oc;for(var i=0;i<=9;i++)if((i%2===1)===po)sc[i]+=30;var e=[];for(var k in sc)e.push([parseInt(k),sc[k]]);e.sort(function(a,b){return b[1]-a[1]});return e.slice(0,5).map(function(x){return x[0]})}
var SC=[s1,s2,s3,s4,s5];

function bs(pd,sf){var rs=[];for(var i=0;i<pd.length-1;i++){var fd=pd.slice(i+1);var pr=sf(fd);var a=pd[i];rs.push(pr.indexOf(a)>=0?"h":"m")}var cp=sf(pd.slice(1));var hc=0,mc=0,mhs=0,mms=0,th=0,tm=0;for(var i=0;i<rs.length;i++){if(rs[i]==="h"){hc++;th++;if(th>mhs)mhs=th;tm=0}else{mc++;tm++;if(tm>mms)mms=tm;th=0}}var cst="",csc=0;for(var i=0;i<rs.length;i++){if(i===0){cst=rs[i];csc=1}else if(rs[i]===cst)csc++;else break}return{cp:cp,hc:hc,mc:mc,mhs:mhs,mms:mms,ch:cst==="h"?csc:0,cm:cst==="m"?csc:0,cn:pd[0]}}

function calcPeakScore(pd,digit){var d=pd;var score=0;var f={};for(var i=0;i<=9;i++)f[i]=0;var r30=d.slice(1,31);for(var i=0;i<r30.length;i++)f[r30[i]]++;var mf=0;for(var k in f)if(f[k]>mf)mf=f[k];if(mf===0)mf=1;score+=(f[digit]/mf)*40;var gap=999;for(var i=1;i<d.length;i++){if(d[i]===digit){gap=i-1;break}}if(gap===999)gap=d.length;var mg=0;for(var i=0;i<=9;i++){var g=999;for(var j=1;j<d.length;j++){if(d[j]===i){g=j-1;break}}if(g===999)g=d.length;if(g>mg)mg=g}if(mg===0)mg=1;score+=(gap/mg)*30;var r15=d.slice(1,16);var oc=0,ec=0;for(var i=0;i<r15.length;i++){if(r15[i]%2===1)oc++;else ec++}var po=ec>oc;if((digit%2===1)===po)score+=30;return Math.round(score)}
function calcTrend(pd,digit){var recent=pd.slice(1,11);var count=0;for(var i=0;i<recent.length;i++){if(recent[i]===digit)count++}if(count>=3)return"↗";if(count<=0)return"↘";return"→"}
function calcStreak(pd,digit){var streak=0;for(var i=1;i<pd.length;i++){if(pd[i]===digit)streak++;else break}return streak}

function analyze(data){if(!data||data.length<10)return null;var posData=[[],[],[],[],[]];for(var d=0;d<data.length;d++){for(var j=0;j<5;j++){posData[j].push(data[d].numbers[j])}}var ar={};for(var j=0;j<5;j++){ar[j]=[];for(var s=0;s<5;s++){ar[j].push(bs(posData[j],SC[s]))}}var best=[];for(var j=0;j<5;j++){var bsIdx=0,mm=999;for(var s=0;s<5;s++){if(ar[j][s].cm<mm){mm=ar[j][s].cm;bsIdx=s}}var r=ar[j][bsIdx];best.push({pos:pNames[j],pred:r.cp,sc:bsIdx+1,sn:sNames[bsIdx],hc:r.hc,mc:r.mc,hr:r.hc+r.mc>0?(r.hc/(r.hc+r.mc)*100).toFixed(0):0,ch:r.ch,cm:r.cm})}var peaks=[];for(var j=0;j<5;j++){var pd=posData[j];var posPeaks=[];for(var digit=0;digit<=9;digit++){posPeaks.push({digit:digit,score:calcPeakScore(pd,digit),trend:calcTrend(pd,digit),count30:(function(){var c=0;var r=pd.slice(1,31);for(var i=0;i<r.length;i++)if(r[i]===digit)c++;return c})(),gap:(function(){for(var i=1;i<pd.length;i++){if(pd[i]===digit)return i-1}return pd.length-1})(),streak:calcStreak(pd,digit)})}posPeaks.sort(function(a,b){return b.score-a.score});peaks.push(posPeaks)}return{data:data,ar:ar,best:best,peaks:peaks,posData:posData}}

function render(){var app=document.getElementById("app");if(!globalData||globalData.length===0){app.innerHTML='<div class="no-data"><h3>No Data</h3><p>Please check network</p></div>';return}var a=globalAnalysis;var cur=globalData[0];var html="";html+='<div class="header"><h1>台湾5分彩 峰值分析</h1><div class="subtitle">'+globalData.length+"期 | 5方案</div></div>";html+='<div class="current-issue"><div class="issue-info">當期 '+cur.issue+" | "+cur.date+" "+cur.time+'</div><div class="numbers-row">';for(var i=0;i<5;i++){html+='<div class="number-ball">'+cur.numbers[i]+"</div>"}html+="</div></div>";html+='<div class="prediction-box"><div class="pred-title">下期預測推薦</div><div class="pred-grid">';for(var j=0;j<5;j++){var peakList=a.peaks[j];var top5=peakList.slice(0,5);html+='<div class="pred-item"><div class="pos-name">'+pNames[j]+'</div><div class="pred-nums">';for(var i=0;i<5;i++){var digit=top5[i].digit;var cls=i===0?"best":(i===4?"worst":"normal");html+='<div class="pred-ball '+cls+'">'+digit+"</div>"}html+='</div><div class="pred-meta"><span class="c-cyan">最高'+top5[0].score+'分</span> | <span class="c-red">最低'+top5[4].score+'分</span></div></div>'}html+="</div></div>";html+='<div class="tabs" id="tabs">';for(var j=0;j<5;j++){html+='<div class="tab '+(j===currentTab?"active":"")+'" data-i="'+j+'">'+pNames[j]+"</div>"}html+="</div>";for(var j=0;j<5;j++){html+='<div class="panel '+(j===currentTab?"active":"")+'" id="p'+j+'">';var peakList=a.peaks[j];var rec5=peakList.slice(0,5);var exc5=peakList.slice(5,10);html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">';html+='<div class="rank-section"><div class="rank-title" style="color:#4ecdc4;border-color:#4ecdc4">推薦5碼</div><div class="rank-list">';for(var i=0;i<5;i++){var item=rec5[i];var maxScore=peakList[0].score;var pct=maxScore>0?(item.score/maxScore*100):0;html+='<div class="rank-item"><div class="rank-ball" style="background:#4ecdc4;color:#0f0f1a">'+item.digit+'</div><div class="rank-bar-bg"><div class="rank-bar" style="width:'+pct+'%;background:#4ecdc4"></div></div><div class="rank-score" style="color:#4ecdc4">'+item.score+'</div><div class="rank-meta">'+item.trend+" 遺"+item.gap+'</div></div>'}html+="</div></div>";html+='<div class="rank-section"><div class="rank-title" style="color:#e94560;border-color:#e94560">排除5碼</div><div class="rank-list">';for(var i=0;i<5;i++){var item=exc5[i];var maxScore=peakList[0].score;var pct=maxScore>0?(item.score/maxScore*100):0;html+='<div class="rank-item"><div class="rank-ball" style="background:#333;border:1px solid #555">'+item.digit+'</div><div class="rank-bar-bg"><div class="rank-bar" style="width:'+pct+'%;background:#e94560"></div></div><div class="rank-score" style="color:#e94560">'+item.score+'</div><div class="rank-meta">'+item.trend+" 遺"+item.gap+'</div></div>'}html+="</div></div>";html+="</div>";for(var s=0;s<5;s++){var r=a.ar[j][s];var rate=r.hc+r.mc>0?(r.hc/(r.hc+r.mc)*100).toFixed(1):0;html+='<div class="scheme-card" style="border-left-color:'+colors[s]+'"><div class="scheme-title" style="color:'+colors[s]+'">方案'+(s+1)+" "+sNames[s]+'</div><div class="scheme-nums"><span>推薦:</span>';for(var i=0;i<r.cp.length;i++){var isHit=r.cp[i]===r.cn;html+='<div class="s-ball '+(isHit?"hit":"miss")+'">'+r.cp[i]+"</div>"}html+='</div><div class="scheme-stats"><div>中/非: '+r.hc+"/"+r.mc+'</div><div>命中率: '+rate+'%</div><div>最高連中/非: '+r.mhs+"/"+r.mms+'</div><div>當前連中/非: '+r.ch+"/"+r.cm+"</div></div></div>"}html+="</div>"}html+='<div class="status-bar">統計僅供參考 | 上次更新: '+new Date().toLocaleTimeString()+"</div>";app.innerHTML=html;document.getElementById("tabs").addEventListener("click",function(e){var t=e.target.closest(".tab");if(!t)return;var idx=parseInt(t.getAttribute("data-i"));if(isNaN(idx))return;currentTab=idx;var tabs=document.querySelectorAll(".tab");var panels=document.querySelectorAll(".panel");for(var i=0;i<5;i++){if(tabs[i])tabs[i].classList.toggle("active",i===idx);if(panels[i])panels[i].classList.toggle("active",i===idx)}})}

function load(){
var diag=document.getElementById("diag");if(diag)diag.innerHTML="";
log("开始加载数据...");
log("API: "+API,"ok");
var url=API+"?_t="+Date.now();
log("请求URL: "+url);
fetch(url,{cache:"no-store"}).then(function(r){
log("收到响应，状态: "+r.status,(r.ok?"ok":"err"));
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}).then(function(data){
log("JSON解析成功","ok");
var arr=Array.isArray(data)?data:(data.data||[]);
log("数据类型: "+(Array.isArray(data)?"数组":"对象"));
log("数据长度: "+arr.length,(arr.length>0?"ok":"err"));
if(!arr||arr.length===0)throw new Error("Empty data");
log("开始分析...");
globalData=arr;globalAnalysis=analyze(globalData);
log("分析完成，开始渲染...","ok");
render();
log("渲染完成！","ok");
}).catch(function(e){
log("错误: "+e.message,"err");
log("请检查: 1)网络连接 2)data.json是否存在 3)GitHub Pages缓存","err");
});
}

load();
setInterval(load,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){log("页面重新可见，刷新数据...");load()}});
log("页面初始化完成，等待加载...");
})();
</script>
</body>
</html>
